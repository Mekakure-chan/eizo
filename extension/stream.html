<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HLSを取得 · 映蔵｜埋め込み動画保存</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/mux-mp4.js"></script>
  <script type="module" src="stream.mjs"></script>
</head>
<body class="transfer">
  <div class="sheet">
    <header><img src="icons/48.png" width="40" height="40" alt="">
      <div><h1 id="heading">HLSを取得</h1><p class="sub" id="source"></p></div>
    </header>
    <main>
      <p id="title" class="title"></p>
      <p id="info" class="hint"></p>
      <p id="status" role="status">配信を確認しています…</p>
      <progress id="progress" hidden></progress>
      <div class="actions">
        <button id="rescan" hidden>元ページで再検出</button>
        <button id="capture" class="quiet" hidden>再生区間をキャプチャ</button>
        <button id="grant" hidden>配信元を許可して取得</button>
        <button id="save" hidden>MP4を保存</button>
        <button id="stop" hidden>取得を停止</button>
        <button id="cancel" class="quiet" hidden>中止</button>
        <button id="retry" class="quiet" hidden>再取得</button>
      </div>
      <details id="alternatives" hidden><summary>他の保存方法</summary>
        <div class="actions">
          <button id="raw" class="quiet" hidden>元のTSを保存</button>
          <button id="direct" class="quiet">元の形式で保存先に直接取得</button>
          <button id="options" class="quiet" hidden>元ページのキャプチャ・保存候補</button>
        </div>
      </details>
    </main>
  </div>
</body>
</html>
