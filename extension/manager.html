<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ダウンロード一覧 · 映蔵｜埋め込み動画保存</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="manager.css">
  <script defer src="vendor/mux-mp4.js"></script>
  <script type="module" src="manager.mjs"></script>
</head>
<body class="manager">
  <header class="brand"><div class="brand-inner"><img src="icons/48.png" width="31" height="31" alt="">
    <span>映蔵｜埋め込み動画保存</span><button id="all" class="quiet" hidden>ダウンロード一覧</button>
  </div></header>
  <main class="desk">
    <h1 id="heading" tabindex="-1">ダウンロード一覧</h1>
    <p id="notice" class="error" role="status" hidden></p>
    <article id="current" class="current" hidden>
      <div class="current-top"><span id="kind"></span><strong id="phase" class="phase"></strong></div>
      <h2 id="title"></h2>
      <a class="source-link" id="original" target="_blank" rel="noopener noreferrer"></a>
      <div class="meter"><progress id="progress" max="1" aria-label="ダウンロードの進捗" hidden></progress><span id="percent"></span></div>
      <p id="status" role="status"></p><p id="info" class="details"></p>
      <div class="actions">
        <button id="owner" class="quiet" hidden>使用中のキューを開く</button>
        <label id="format-label" hidden>録画形式 <select id="format"></select></label>
        <button id="save" hidden>保存</button><button id="grant" hidden>許可して取得</button>
        <button id="record" hidden>録画を開始</button><button id="stop" hidden>取得を停止</button>
        <button id="retry" hidden>再取得</button><button id="rescan" hidden>元ページで再検出</button>
        <button id="skip-gaps" hidden>欠損区間をスキップして再取得</button>
        <button id="capture" class="quiet" hidden>再生区間をキャプチャ</button>
        <button id="show" class="quiet" hidden>動画のタブを表示</button>
        <button id="cancel" class="quiet" hidden>中止</button>
        <button id="raw" class="quiet" hidden>元のTSを保存</button>
        <button id="discard" class="subtle" hidden>保存待ちを破棄</button>
      </div>
    </article>
    <section class="folder-setting" aria-label="保存先">
      <div class="folder-heading"><span>保存先 <strong id="folder-name" aria-live="polite">毎回選択</strong></span><span id="folder-count"></span></div>
      <div class="folder-options">
        <div id="folder-presets" role="group" aria-label="登録した保存先"></div>
        <button id="clear-folder" class="quiet folder-option" hidden>毎回選ぶ</button>
        <button id="choose-folder" class="quiet">保存先を指定</button>
        <button id="grant-folder" hidden>自動保存を許可</button>
      </div>
      <details id="manage-folders" hidden><summary>登録先を管理</summary><div id="registered-folders"></div></details>
      <p id="folder-feedback" role="status"></p>
    </section>
    <section id="collection" hidden>
      <div class="section-title"><h2 id="list-title">元ページ別のキュー</h2><span id="list-count"></span></div>
      <div id="list-filters" role="group" aria-label="状態で絞り込み" hidden>
        <button type="button" data-filter="all" aria-pressed="true">すべて <span>0</span></button>
        <button type="button" data-filter="active" aria-pressed="false">進行中 <span>0</span></button>
        <button type="button" data-filter="queued" aria-pressed="false">順番待ち <span>0</span></button>
        <button type="button" data-filter="attention" aria-pressed="false">操作待ち <span>0</span></button>
        <button type="button" data-filter="stopped" aria-pressed="false">中断・エラー <span>0</span></button>
        <button type="button" data-filter="saved" aria-pressed="false">保存済み <span>0</span></button>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="details" hidden>ダウンロードはまだありません。動画ページで拡張アイコンを押すと、ここに取得状況が表示されます。</p>
    </section>
    <label class="gap-setting"><input id="allow-gaps" type="checkbox" disabled> HLSの欠損区間を自動でスキップ</label>
  </main>
</body>
</html>
