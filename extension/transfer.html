<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>動画の保存 · 映蔵｜埋め込み動画保存</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="transfer.mjs"></script>
</head>
<body class="transfer">
  <div class="sheet">
    <header><img src="icons/48.png" width="40" height="40" alt="">
      <div><h1 id="heading">動画の保存</h1><p class="sub" id="source"></p></div>
    </header>
    <main>
      <p id="title" class="title"></p>
      <p id="info" class="hint"></p>
      <label id="format-label" hidden>保存形式 <select id="record-format"></select></label>
      <p id="status" role="status">準備しています…</p>
      <progress id="progress" hidden></progress>
      <div class="actions">
        <button id="rescan" hidden>元ページで再検出</button>
        <button id="capture" class="quiet" hidden>再生区間をキャプチャ</button>
        <button id="grant" hidden>配信元を許可して続ける</button>
        <button id="start" hidden>保存先を選ぶ</button>
        <button id="stop" hidden>停止して保存</button>
        <button id="show" class="quiet" hidden>動画のタブを表示</button>
        <button id="cancel" class="quiet" hidden>中止</button>
        <button id="retry" class="quiet" hidden>やり直す</button>
      </div>
    </main>
  </div>
</body>
</html>
